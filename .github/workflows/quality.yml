name: Classroom Desk quality gates
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, redesign/frontend-v2, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node tools/source-secret-check.mjs
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
